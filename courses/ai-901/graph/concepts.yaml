- id: synthesis-waveform-generation
  label: Waveform generation and neural vocoders
  summary: Speech synthesis uses an acoustic model to turn phonemes and prosody into mel-spectrograms,
    or sound-frequency representations over time, then uses vocoding to create an audio waveform of amplitude
    values, commonly 16,000–48,000 samples per second, followed by optional filtering, normalization,
