  summary: Term Frequency, or TF, is how many times a word appears in a document, such as tf(agent) =
    6 when "agent" appears six times. Inverse Document Frequency, or IDF, checks how common or rare a
    word is across all documents, using idf(t) = log(N / df(t)), and TF-IDF combines them as tfidf(t,
