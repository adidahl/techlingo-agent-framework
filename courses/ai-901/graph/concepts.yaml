- id: asynchronous-video-job
  label: Asynchronous video workflow
  summary: 'Video generation is resource-intensive and normally runs as an asynchronous job: create a
    job, poll its status, then download the completed video. Polling means repeatedly checking status
    until it is completed or failed; the creation request returns a video ID, POST /openai/v1/videos includes
