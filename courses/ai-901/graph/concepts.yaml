- id: tpm-rpm-and-throttling
  label: Tokens per minute, requests per minute, and throttling
  summary: A token is the smallest unit of text or data a generative AI model processes, such as a word,
    subword, character, or punctuation. Tokens per minute, or TPM, is an allocation and rate limit for
    token traffic per minute, while requests per minute, or RPM, limits how many requests can be handled
    per minute; higher TPM increases capacity, and lower TPM reduces token use across requests. Some high-end
    reasoning models, such as DeepSeek R1, Grok, and large Llama versions, can have high TPM ceilings,
    while specialized or image models can use capacity units instead. Throttling intentionally slows or
    limits compute near processing limits to preserve stability and responsiveness; large prompts, high
    maximum-output-token settings, or too many concurrent requests can cause rate-limit errors, so lowering
    max tokens or concurrent requests can help.
