schema_version: concept-graph-v1
concepts:
- id: computer-vision-inputs-and-uses
  label: Computer vision inputs and uses
  summary: Computer vision is a field of artificial intelligence (AI) where software processes visual
    input from images, videos, or live camera streams. It lets AI applications process visual information
    and emulate parts of human visual perception, even though computers do not have biological eyes; examples
    include autonomous vehicles detecting traffic and pedestrians, smart checkout cameras identifying
    products, and doorbell cameras detecting people.
  depth: null
  confusable_with:
  - image-understanding-tasks
  - digital-image-representation
  source:
    file: 5. Introduction to computer vision concepts.md
  lessons: []
  prerequisites: []
  provenance: generated
  pinned: false
  status: retired
- id: image-understanding-tasks
  label: Image understanding tasks
  summary: Image classification predicts one text label for the main subject of an image, such as apple,
    orange, or banana. Object detection finds individual objects and their locations using rectangular
    bounding boxes; semantic segmentation classifies individual pixels for more precise object locations;
    contextual image analysis interprets relationships between objects and text so a multimodal computer
    vision model can describe images or suggest tags.
  depth: mechanism
  confusable_with:
  - computer-vision-inputs-and-uses
  - convolutional-neural-network-training
  source:
    file: 5. Introduction to computer vision concepts.md
  lessons: []
  prerequisites: []
  provenance: generated
  pinned: false
  status: retired
- id: digital-image-representation
  label: Digital image representation
  summary: To a computer, an image is an array of numeric pixel values. Resolution is the row-by-column
    size, such as 7x7 pixels; a grayscale image has one layer where 0 means black, 255 means white, and
    values between are shades of gray; most color images use three RGB channels for red, green, and blue,
    such as purple with red 150, green 0, blue 255, or yellow with red 255, green 255, blue 0.
  depth: null
  confusable_with:
  - computer-vision-inputs-and-uses
  - filters-and-convolution
  source:
    file: 5. Introduction to computer vision concepts.md
  lessons: []
  prerequisites: []
  provenance: generated
  pinned: false
  status: retired
- id: filters-and-convolution
  label: Filters and convolution
  summary: A filter modifies pixel values to create a visual effect, and a filter kernel is an array of
    weights such as a 3x3 kernel. Convolution moves the kernel across image patches, multiplies each pixel
    by its matching weight, and sums the results; padding, usually 0, handles outside edges, outputs may
    be adjusted into the 0 to 255 range, and convolutional filtering can create effects such as edge highlighting
    with a Laplace filter, blurring, sharpening, or color inversion.
  depth: null
  confusable_with:
  - digital-image-representation
  - convolutional-neural-network-training
  source:
    file: 5. Introduction to computer vision concepts.md
  lessons: []
  prerequisites: []
  provenance: generated
  pinned: false
  status: retired
- id: convolutional-neural-network-training
  label: Convolutional neural networks
  summary: A convolutional neural network (CNN) is a deep learning architecture that uses filters to extract
    numeric feature maps from images and then predicts labels. CNNs extract meaning or actionable insights
    from images, not just visual effects.
  depth: mechanism
  confusable_with:
  - convolutional-filtering-and-laplace
  - image-classification
  source:
    file: 5. Introduction to computer vision concepts.md
  lessons: []
  prerequisites: []
  provenance: generated
  pinned: false
  status: retired
- id: vision-transformers-and-multimodal-generation
  label: Vision transformers, multimodal models, and generation
  summary: A transformer is a neural network architecture that encodes language tokens or image patches
    as vector-based embeddings, using attention to reflect context; in language, tokens used in similar
    contexts have similar vector directions, supporting NLP tasks such as text analysis, translation,
    and language generation. A vision transformer (ViT) creates a visual vocabulary from image patches
    and visual features such as color, shape, contrast, and texture; multimodal models combine language
    and vision encoders with cross-model attention in a shared vector space, enabling image descriptions
    and image synthesis; diffusion uses a natural language prompt to start from random pixel noise and
    iteratively remove noise until the image matches the prompt, while video generation also accounts
    for physical behavior and temporal progression, meaning a logical sequence over time.
  depth: null
  confusable_with:
  - image-understanding-tasks
  - convolutional-neural-network-training
  source:
    file: 5. Introduction to computer vision concepts.md
  lessons: []
  prerequisites: []
  provenance: generated
  pinned: false
  status: retired
