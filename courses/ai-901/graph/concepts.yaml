- id: rest-api-video-jobs
  label: REST video jobs
  summary: A REST API is a web interface that lets programs communicate using HTTP, while an SDK is a
    developer-friendly toolkit built on top of an interface such as a REST API. For Sora 2 video generation,
    users can use Bash, a command line shell and scripting language, and curl, a command line tool that
    sends HTTP requests and receives responses, to create an asynchronous render job with POST /openai/v1/videos,
    poll status with GET /openai/v1/videos/{video_id} until completed or failed, then download the completed
    MP4 from /openai/v1/videos/{video_id}/content?variant=video as output.mp4; this requires an Azure
    OpenAI or Foundry resource in a supported region, a Sora deployment, and authentication by API key
    or Microsoft Entra ID, and jobs often take 1-5 minutes.
