- id: tf-idf-calculation
  label: Calculating TF-IDF
  summary: Term Frequency is the count of term t in document d, so tf(agent) = 6 when ‘agent’ occurs six
    times; document frequency df(t) is the number of documents containing t, and Inverse Document Frequency
    is idf(t) = log(N / df(t)), where N is the total number of documents. Calculate TF, calculate IDF,
    and multiply them as tfidf(t, d) = tf(t, d) × log(N / df(t)); if AI, Microsoft, and agent occur in
    both of two documents, N = 2 and df(t) = 2, so idf(t) = log(2/2) = 0 and those terms have no discriminative
    weight.
