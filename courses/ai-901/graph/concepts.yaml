  summary: 'Vector arithmetic adds or subtracts matching dimensions to produce a new vector: dog [0.8,
    0.6, 0.1] + young [0.1, 0.1, 0.3] = puppy [0.9, 0.7, 0.4], and cat [0.7, 0.5, 0.2] + young = kitten
    [0.8, 0.6, 0.5], so the young vector encodes a move from an adult animal to its young counterpart.
    Vector subtraction reverses that relationship: puppy − young = dog, and kitten − young = cat.'
  depth: mechanism
  confusable_with:
