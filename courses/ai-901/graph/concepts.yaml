- id: analogy-and-nearest-vector-search
  label: Analogies and nearest-vector search
  summary: 'Analogical reasoning uses consistent vector differences to infer a missing term: ‘puppy is
    to dog as kitten is to what?’ is solved by kitten − puppy + dog = [0.8, 0.6, 0.5] − [0.9, 0.7, 0.4]
    + [0.8, 0.6, 0.1] = [0.7, 0.5, 0.2] = cat. Real vector arithmetic rarely produces an exact stored
    vector, so nearest-vector search returns the known word vector most similar to the calculated result.'
