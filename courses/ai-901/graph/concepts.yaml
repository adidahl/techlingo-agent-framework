- id: mfcc-extraction-sequence
  label: How MFCC features are extracted
  summary: MFCC processing divides audio into overlapping 20–30 millisecond frames, uses a Fourier transform
    to change each frame from the time domain, values over time, to the frequency domain, pitches present,
    and maps frequency bins to the human-hearing-based Mel scale. It then produces about 13 coefficients
    per frame as a feature vector; the column-wise vector sequence becomes acoustic-model input, with
    example vectors beginning [-113.2, 45.3, 12.1, -3.4, 7.8], [-112.8, 44.7, 11.8, -3.1, 7.5], and [-110.5,
